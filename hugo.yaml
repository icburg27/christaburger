baseURL: "https://christaburger.com"
languageCode: "en-us"
title: "Christa Burger"
enableRobotsTXT: true
theme: "christa"

params:
  tagline: "Governance for the world that actually exists."
  subtagline: "Risk you can see. Controls that hold. Accountability that survives contact with Tuesday."
  description: "Christa Burger is a CISO and VP of Cybersecurity with twenty years in cybersecurity governance, risk, and compliance across financial services and regulated industries. MBA in Finance. Board director."
  author: "Christa Burger"
  email: "christa@christaburger.com"

  proofbar:
    - "CISO & VP of Cybersecurity"
    - "20 Years in Cybersecurity Governance"
    - "Financial Services & Trust"
    - "MBA, Finance"
    - "Board Director, 14 Years"
    - "Author & Keynote Speaker"

  services:
    - title: "Risk Oversight & Effective Challenge"
      icon: "⊕"
      url: "/categories/governance-and-ai/"
      link_label: "The Governance Writing →"
      description: "Independent assessment of first-line work. Risk appetite statements, key risk indicators, and the judgment to escalate an emerging risk before the incident rather than after it."
    - title: "Governance Architecture"
      icon: "◈"
      url: "/work-with-me/"
      link_label: "How I Build It →"
      description: "Turning complex work into accountable decision systems: who decides, what values guide it, what risk is acceptable, how accountability flows, and how the system changes when reality changes."
    - title: "Board & Regulatory Communication"
      icon: "❖"
      url: "/speaking/"
      link_label: "Speaking to Boards →"
      description: "Residual risk in thirty seconds. Reporting that survives a board risk committee and an examiner in the same week — technical truth translated without being diluted."
    - title: "Emerging Technology Risk"
      icon: "✦"
      url: "/categories/quest-layer/"
      link_label: "The AI Governance Work →"
      description: "AI governance past the policy document: identity, intent, limits, drift detection, and succession for systems that act. The frontier lane of the practice, and the one boards are asking about now."

# Top-level IA: Ideas · Work · Book · About · Contact
